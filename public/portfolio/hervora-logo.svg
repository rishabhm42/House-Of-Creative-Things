<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <rect width="1000" height="1000" fill="#2E0308" />
  <!-- Minimalist subtle vignette/atmosphere -->
  <radialGradient id="hervoraGlow" cx="50%" cy="50%" r="65%">
    <stop offset="0%" stop-color="#4A0812" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#220105" stop-opacity="0.9"/>
  </radialGradient>
  <rect width="1000" height="1000" fill="url(#hervoraGlow)" />
  
  <g transform="translate(500, 480)" text-anchor="middle">
    <!-- Logotype HERVORA -->
    <text font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Didot', 'Bodoni MT', serif" 
          font-weight="300" 
          font-size="82" 
          letter-spacing="0.28em" 
          fill="#FAF4EC" 
          x="12" y="0">
      HERVORA
    </text>
    
    <!-- Subtitle THE ART OF DRESSING -->
    <text font-family="'Cinzel', 'Montserrat', 'Helvetica Neue', sans-serif" 
          font-weight="300" 
          font-size="24" 
          letter-spacing="0.34em" 
          fill="#E6DAC8" 
          x="12" y="68">
      THE ART OF DRESSING
    </text>
  </g>
</svg>
